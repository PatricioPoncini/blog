name: Quality Check

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier (format check)
        run: npm run format:check

      - name: Build project
        run: npm run build
